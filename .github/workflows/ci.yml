name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to upload release assets
      packages: write # Needed to publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Critical for git-sensitive-semantic-versioning

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          # Match gradle/gradle-daemon-jvm.properties so Gradle uses this protected JDK.
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Block compromised Java certificates
        uses: Expensify/GitHub-Actions/block-compromised-java-certificates@d8dfc3ddd4d8626206653c6168ca8d094547749a

      - name: Restrict Gradle to the protected JDK
        run: |
          # Prevent cached or downloaded toolchains from bypassing the certificate blocklist.
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          org.gradle.java.installations.auto-detect=false
          org.gradle.java.installations.auto-download=false
          org.gradle.java.installations.fromEnv=JAVA_HOME
          org.gradle.java.installations.paths=$JAVA_HOME
          EOF

      - name: Install NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066"

      # Run checks (tests, lint) on every trigger
      - name: Build Artifacts
        if: github.event_name == 'release'
        run: ./gradlew build

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            **/build/outputs/aar/*.aar
